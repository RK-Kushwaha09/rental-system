name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Live Cloud Backend API URL'
        required: false
        default: 'https://rentmanager-backend.onrender.com/api'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build RentManager Pro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Web App
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.backend_url || 'https://rentmanager-backend.onrender.com/api' }}
        run: npm run build

      - name: Grant Execute Permission to Gradlew
        run: chmod +x frontend/android/gradlew

      - name: Copy Web Assets to Android
        working-directory: frontend
        run: npx cap copy android

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk build-output/RentManagerPro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RentManagerPro-APK
          path: build-output/RentManagerPro.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: RentManager Pro v1.0.0 (Android APK)
          body: |
            ### 📱 RentManager Pro Mobile App
            Direct Android APK release for testing and production.
            - Download `RentManagerPro.apk` below.
            - Send via WhatsApp or install directly on any Android device.
          files: build-output/RentManagerPro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
