server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Spring Application Name
spring.application.name=rentmanager-backend

# MySQL 8.0 Datasource Configuration (Default for Local Development)
# Environment variables DB_URL, DB_USERNAME, DB_PASSWORD take precedence (e.g. Docker / Render)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rentmanager_pro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:raj159kumar}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# JWT Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.rentmanager=INFO
logging.level.org.springframework.security=WARN

# Multipart configuration for high-resolution diary uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB

# Gemini Vision API for Diary Scanning
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}
